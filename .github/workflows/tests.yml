# Check point B of docs/ORCHESTRATION.md: every pull request, whoever wrote it, passes the same checks.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (card rules, worlds, review load, sharing, saved-record safety)
        run: node --test tests/*.test.mjs
      - name: Saved-record fixtures were not removed
        run: test "$(ls tests/fixtures/saves/*.json | wc -l)" -ge 2
      - name: World data (4,610 cards assigned once, generator output reproducible)
        run: |
          python3 -I tools/build_world_pixel_assets.py --check
          python3 -I tools/make_worlds.py --check
          python3 -I tools/check_world_generation.py
          python3 -I tools/audit_p1_review.py --check
      - name: Rule baseline (simulation output unchanged)
        run: node tools/check_sim_baseline.mjs
      - name: Install the test browser
        run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/cards_e2e.cjs
